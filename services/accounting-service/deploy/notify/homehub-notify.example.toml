# Example notifier config. Copy to ~/.config/homehub-notify.toml (mode 0600) and edit.
# Placeholders only.
api_base = "http://127.0.0.1:8000"
token_file = "~/.config/homehub-notify-token"
hub_base_url = "https://hub.example.invalid"       # for links in messages
discord_target = "discord:<channel-id>"
lead_business_days = 2                             # debit reminder window
weekly_open_case_limit = 10                        # items listed per account before "+N more"
expected_statement_grace_days = 7
min_buffer = "0"                                   # projected balance must stay >= this
state_file = "~/.local/state/homehub-notify/state.json"
# portfolio_base = "http://127.0.0.1:8001"         # enables the 國泰證券 statement section; absent = section off
# portfolio_token_file = "~/.config/homehub-notify-portfolio-token"  # portfolio API bearer token (read label); absent = no header
cathay_run_time = "06:40"                          # the worker's daily run, Asia/Taipei (HH:MM)
cathay_run_grace_minutes = 15                      # a run later than this after cathay_run_time counts as missed (0-1439)

[lead_overrides]                                   # per account id, e.g. a US card
# "123" = 4

[terms]
report_dir = "~/reports/home-hub-terms"      # archive root, created 0700
hermes_toolsets = "web"                       # passed to `hermes -t`; must be exactly "web" (§3)
max_output_bytes = 4194304                    # cap on archived hermes stdout/stderr; past it the run fails
hermes_timeout_seconds = 1800                 # 1..1840: the units' TimeoutStartSec=1900 must outlast Hermes by 60 s
hermes_model = "claude-sonnet-5-5"            # required: config bypass has no model default
# hermes_provider = "anthropic"                # default anthropic
ignore_accounts = []                          # active-rule cards the owner chose not to maintain; never reported as 未登錄
terms_state_file = "~/.local/state/homehub-notify/terms-state.json"

[terms.cards."101"]                            # key = HomeHub account id (string, TOML table key)
official = "滙豐 Live+ 現金回饋卡"
bank_domains = ["hsbc.com.tw"]
tier = "precise"                              # precise | signal
# country = "TW"                              # default TW; ISO 3166-1 alpha-2
# language = "zh-TW"                          # default zh-TW; language to search and read in
# currency = "TWD"                            # default TWD; unit of caps/amounts in the terms
# aliases = []                                # extra names to search (old names, English names)
# year_end_window = true                      # default: true when country is TW, false otherwise

# Dismiss list: findings the owner accepted, so they stop repeating. The notifier matches them itself; Hermes
# never sees them. Hidden items stay in the run's result.json and are listed in dismissed.json.
[[terms.cards."101".dismiss]]                 # one rule field, pinned to the value the bank publishes:
field = "starts_on"                           # it comes back when the bank prints another value
rule = 162                                    # the rule id (result.json: findings[].rule_id)
value = "2026-07-01"                          # pin: dates, rate / fixed_amount / total_cap, is_basic, method, window
note = "the bank prints the current period only"

[[terms.cards."101".dismiss]]                 # no value = any value of that field of that rule
field = "description"                         # name and description can only be dismissed whole
rule = 163

[[terms.cards."101".dismiss]]                 # a programme the owner does not want as a rule
field = "missing_rule"
contains = ["LINE Pay", "10%"]                # every string must occur in the finding's text or quote
until = "2026-12-31"                          # required here: the last day the entry applies

[[terms.cards."101".dismiss]]                 # announced terms the rules already cover
field = "next_terms"
value = "2027-03-31"                          # the announced period's end date
rates = ["0.88/none", "3/888", "1/200", "1/200"]  # optional: the announced rows as "rate/cap"; when the bank
                                              # revises a number within the same period the block shows again

[terms.cards."102"]
official = "國泰世華 CUBE 卡"
bank_domains = ["cathaybk.com.tw", "cathay-cube.com.tw"]
tier = "signal"

[terms.cards."301"]                           # an overseas card — illustrative product, fictional id
official = "Chase Freedom Flex"
bank_domains = ["chase.com", "creditcards.chase.com"]
tier = "precise"                              # 5% rotating quarterly categories (cap per quarter) fit the rule model
country = "US"
language = "en"
currency = "USD"
aliases = ["Freedom Flex", "Chase Freedom Flex Mastercard"]
# year_end_window defaults to false for country != TW; the monthly run catches each quarter's categories
