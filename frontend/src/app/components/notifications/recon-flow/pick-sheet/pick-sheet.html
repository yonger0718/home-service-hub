<div class="overlay" data-overlay (click)="cancel()">
  <div
    class="sheet pick-sheet"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="flow-pick-title"
    (click)="$event.stopPropagation()"
  >
    <div class="grab" aria-hidden="true" appSheetPull (pulled)="cancel()"></div>
    <h3 id="flow-pick-title">{{ heading() }}</h3>
    @if (sub(); as line) {
      <p class="pick-sub">{{ line }}</p>
    }

    <div class="pick-options" role="radiogroup" aria-labelledby="flow-pick-title">
      @for (option of options(); track option.id) {
        <label class="pick-row">
          <input
            type="radio"
            name="flow-pick"
            [value]="option.id"
            [checked]="choice() === option.id"
            (change)="choice.set(option.id)"
          />
          <span>{{ option.label }}</span>
        </label>
      }
    </div>

    <div class="btnrow">
      <button type="button" class="sheet-cancel" (click)="cancel()">取消</button>
      <button type="button" class="pri sheet-confirm" [disabled]="choice() === null" (click)="confirm()">
        確定
      </button>
    </div>
  </div>
</div>
