<div class="page-header-row">
  @if (showBack()) {
    <button class="page-back" type="button" aria-label="返回" (click)="goBack()">‹</button>
  }
  <div class="page-title">
    <h1>{{ heading() }}</h1>
    @if (subtitle()) {
      <span class="page-subtitle">{{ subtitle() }}</span>
    }
  </div>
  <div class="page-actions"><ng-content></ng-content></div>
  @if (phone() && menu().length) {
    <div class="header-more-wrap" (keydown)="onMenuKeydown($event)" (pointerdown)="onMenuPress(true)" (pointercancel)="onMenuPress(false)" (click)="onMenuPress(false)">
      <button #more type="button" [id]="menuId + '-button'" class="header-more" aria-label="更多動作" aria-haspopup="menu"
              [attr.aria-expanded]="menuOpen()" [attr.aria-controls]="menuOpen() ? menuId : null" (click)="toggleMenu()">
        <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
      </button>
      @if (menuOpen()) {
        <div class="header-menu" role="menu" [id]="menuId" [attr.aria-labelledby]="menuId + '-button'" (focusout)="onMenuFocusout($event)">
          @for (item of menu(); track $index) {
            @if (item.routerLink && !item.disabled) {
              <a #menuItem class="header-menu-item" role="menuitem" [routerLink]="item.routerLink" [queryParams]="item.queryParams ?? null" (click)="runItem(item)">
                @if (item.icon) { <i class="pi {{ item.icon }}" aria-hidden="true"></i> }
                {{ item.label }}
              </a>
            } @else {
              <button #menuItem type="button" class="header-menu-item" role="menuitem" [attr.aria-disabled]="item.disabled || null" (click)="runItem(item)">
                @if (item.icon) { <i class="pi {{ item.icon }}" aria-hidden="true"></i> }
                {{ item.label }}
              </button>
            }
          }
        </div>
      }
    </div>
  }
  @if (gear()) {
    <ng-container *ngTemplateOutlet="gearLink" />
  }
</div>
@if (phone()) {
  <app-sub-nav></app-sub-nav>
}
<ng-template #gearLink>
  <a class="header-gear" routerLink="/settings" aria-label="設定"><i class="pi pi-cog" aria-hidden="true"></i></a>
</ng-template>
