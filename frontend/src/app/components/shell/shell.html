<div
  class="hub-layout"
  [class.compact-height]="layout.compactHeight()"
  [class.sidebar-expanded]="sidebarExpanded()"
  [class.sidebar-rail]="!sidebarExpanded()"
  [style.--sidebar-w]="sidebarWidth()"
>
  <app-sidebar />

  <div class="hub-main">
    <main class="hub-page">
      <router-outlet />
    </main>
  </div>

  @if (showFab()) {
    <a
      class="hub-fab"
      [style.--fab-right]="paneState.fabRight()"
      [attr.href]="entryFormHref"
      (click)="openEntryForm($event)"
      aria-label="記一筆（快捷鍵 N）"
    >
      <span class="fab-plus" aria-hidden="true">+</span>
      <span class="fab-tip" aria-hidden="true">記一筆 <kbd>N</kbd></span>
    </a>
  }

  <app-mobile-nav />
</div>
