<div class="mobile-nav-shell">
  <nav class="m-tabbar" aria-label="分頁導覽">
    @for (slot of nav.tabBar().slots; track $index) {
      @if (slot.kind === 'plus') {
        <a class="m-plus" routerLink="/accounting/entry" aria-label="新增記錄"><span aria-hidden="true">+</span></a>
      } @else {
        @let group = slot.group;
        @let active = nav.activeGroup().id === group.id;
        <a
          class="m-tab"
          [class.active]="active"
          [routerLink]="group.defaultPath"
          [attr.aria-current]="active ? 'page' : null"
        >
          <i class="pi {{ group.icon }}" aria-hidden="true"></i>
          <span class="tab-label">{{ group.tabLabel ?? group.label }}</span>
          @if (hasDot(group)) {
            <span class="tab-dot" aria-hidden="true"></span>
            <span class="visually-hidden">，有待處理項目</span>
          }
        </a>
      }
    }
  </nav>
</div>
