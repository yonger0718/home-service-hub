<p class="visually-hidden" aria-live="polite">{{ liveText() }}</p>
<p class="visually-hidden" [id]="handleHintId">鍵盤請用「更多動作」裡的上移、下移</p>
@for (row of rows(); track row.rule.id; let i = $index, first = $first, last = $last) {
  @if (dropBefore() === i) { <div class="rule-drop-line" aria-hidden="true"></div> }
  <div
    class="rule-row"
    [attr.data-rule-id]="row.rule.id"
    [class.inactive]="row.state !== 'active'"
    [class.dragging]="dragMoved() && drag()?.id === row.rule.id"
  >
    <button
      type="button"
      class="rule-handle"
      [class.busy]="busy()"
      [attr.aria-label]="'拖曳排序 ' + row.rule.name"
      [attr.aria-describedby]="handleHintId"
      (pointerdown)="onHandleDown($event, i)"
      (pointermove)="onHandleMove($event)"
      (pointerup)="onHandleUp($event)"
      (pointercancel)="cancelDrag()"
      (lostpointercapture)="onLostCapture($event)"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
        <path d="M9 6h.01 M9 12h.01 M9 18h.01 M15 6h.01 M15 12h.01 M15 18h.01" />
      </svg>
    </button>
    <button type="button" class="rule-open" (click)="open.emit(row.rule)">
      <span class="rule-title">
        <b class="rule-label">{{ row.title }}</b>
        <span class="rule-rate">{{ row.rate }}</span>
        @if (row.tag; as tag) {
          <span class="badge rule-state" [attr.data-state]="row.state" [class.warn]="row.state === 'expired'">{{ tag }}</span>
        }
        @if (row.basic) { <span class="badge rule-basic">基本</span> }
        @if (row.rule.moze_id) { <span class="badge rule-moze">來自 MOZE</span> }
        <small class="rule-posting">· {{ row.posting }}</small>
      </span>
      @if (row.usage; as use) {
        <app-cap-bar [used]="use.used" [estimated]="use.estimated" [cap]="use.cap" [unit]="row.unit!" />
      } @else if (row.muted; as muted) {
        <small class="rule-muted">{{ muted }}</small>
      }
    </button>
    <app-switch
      class="rule-enabled"
      [checked]="row.rule.is_enabled"
      [disabled]="busy()"
      [ariaLabel]="row.rule.name + ' 啟用'"
      (checkedChange)="toggle.emit({ rule: row.rule, enabled: $event })"
    />
    <div
      class="rule-more-wrap"
      (keydown)="onMenuKeydown($event)"
      (focusout)="onMenuFocusout($event)"
      (pointerdown)="onMenuPress(true)"
      (pointercancel)="onMenuPress(false)"
      (click)="onMenuPress(false)"
    >
      <button
        type="button"
        class="rule-more"
        [id]="menuId(row.rule) + '-button'"
        [attr.aria-label]="row.rule.name + ' 更多動作'"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuFor() === row.rule.id"
        [attr.aria-controls]="menuFor() === row.rule.id ? menuId(row.rule) : null"
        (click)="toggleMenu(row.rule)"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="19" cy="12" r="1.8" />
        </svg>
      </button>
      @if (menuFor() === row.rule.id) {
        <div class="rule-menu" role="menu" [id]="menuId(row.rule)" [attr.aria-labelledby]="menuId(row.rule) + '-button'">
          <button type="button" class="rule-menu-item" role="menuitem" (click)="runMenu('edit', row.rule, i)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-4-4L4 16v4z" />
            </svg>
            編輯
          </button>
          <button type="button" class="rule-menu-item" role="menuitem" [disabled]="first || busy()" (click)="runMenu('up', row.rule, i)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5 M6 11l6-6 6 6" />
            </svg>
            上移
          </button>
          <button type="button" class="rule-menu-item" role="menuitem" [disabled]="last || busy()" (click)="runMenu('down', row.rule, i)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14 M6 13l6 6 6-6" />
            </svg>
            下移
          </button>
          <button type="button" class="rule-menu-item danger" role="menuitem" (click)="runMenu('delete', row.rule, i)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16 M10 11v6 M14 11v6 M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12 M9 7V4h6v3" />
            </svg>
            刪除
          </button>
        </div>
      }
    </div>
  </div>
}
@if (dropBefore() === rows().length) { <div class="rule-drop-line" aria-hidden="true"></div> }
