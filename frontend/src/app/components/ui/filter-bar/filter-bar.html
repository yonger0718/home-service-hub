<ng-template #secondary><ng-content select="[filterBarSecondary]" /></ng-template>
<div class="filter-bar">
  <div class="filter-bar-row" [hidden]="rowHidden()">
    <div class="slot-search"><ng-content select="[filterBarSearch]" /></div>
    <div class="slot-primary"><ng-content select="[filterBarPrimary]" /></div>
    <button #toggleBtn type="button" class="filter-toggle" aria-haspopup="dialog" [attr.aria-expanded]="open()" [attr.aria-controls]="open() ? panelId : null" (click)="toggle()">篩選{{ count() > 0 ? ' ' + count() : '' }}</button>
  </div>
  @if (!chipsHidden()) {
    <app-filter-chips [chips]="chips()" (remove)="remove.emit($event)" (clearAll)="clearAll.emit()" />
  }
  @if (open()) {
    @if (isPhone()) {
      <div class="filter-overlay" (click)="close()">
        <div #panel class="filter-panel sheet" [id]="panelId" tabindex="-1" role="dialog" aria-modal="true" aria-label="篩選" (click)="$event.stopPropagation()" (keydown.escape)="onPanelEscape($event)">
          <div class="grab" aria-hidden="true" appSheetPull (pulled)="close()"></div>
          <div class="slot-secondary"><ng-container [ngTemplateOutlet]="secondary" /></div>
          <div class="panel-actions">
            <button type="button" class="panel-reset" (click)="reset.emit()">重設</button>
            <button type="button" class="panel-apply" (click)="close()">套用</button>
          </div>
        </div>
      </div>
    } @else {
      <div #panel class="filter-panel popover" [style.position]="anchorTop() !== null ? 'fixed' : null" [style.top.px]="anchorTop()" [style.right.px]="anchorRight()" [id]="panelId" tabindex="-1" role="dialog" aria-label="篩選" (keydown.escape)="onPanelEscape($event)">
        <div class="slot-secondary"><ng-container [ngTemplateOutlet]="secondary" /></div>
        <div class="panel-actions">
          <button type="button" class="panel-reset" (click)="reset.emit()">重設</button>
          <button type="button" class="panel-apply" (click)="close()">套用</button>
        </div>
      </div>
    }
  }
</div>
