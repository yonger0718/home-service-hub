<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InventoryUi</title>
  <base href="/hub/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HomeHub">
  <script>
    (function () {
      var root = document.documentElement;
      var storage = null;
      try {
        storage = window.localStorage;
      } catch (error) {
        storage = null;
      }

      function read(key) {
        try {
          return storage ? storage.getItem(key) : null;
        } catch (error) {
          return null;
        }
      }

      var prefersDark = false;
      try {
        prefersDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (error) {
        prefersDark = false;
      }

      // Same rule as AppearanceService: a valid hh-theme wins; an invalid one
      // means system (no fall-through); hh-dark is read only when hh-theme is
      // absent ('1' dark, '0' light, else system). Never writes storage.
      var theme = read('hh-theme');
      var dark;
      if (theme === 'light' || theme === 'dark') {
        dark = theme === 'dark';
      } else if (theme !== null) {
        dark = prefersDark;
      } else {
        var legacy = read('hh-dark');
        dark = legacy === '1' ? true : legacy === '0' ? false : prefersDark;
      }
      var gainLoss = read('hh-gainloss') === 'western' ? 'western' : 'asian';

      root.classList.toggle('app-dark-mode', dark);
      root.setAttribute('data-gainloss', gainLoss);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
