<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>記一筆 · 手機</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 6px">
    <a href="TimelinePhone.dc.html" aria-label="取消" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.border}}; box-sizing: border-box; color: {{t.text}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18 M6 6l12 12"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em">記一筆</h1>
    <a href="TimelinePhone.dc.html" aria-label="儲存" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
    </a>
  </header>

  <div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div role="tablist" aria-label="記錄類型" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: {{t.soft}}; border-radius: 12px; padding: 3px; gap: 2px">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{k.on}}" onClick="{{k.pick}}" style="border: 0; background: {{k.bg}}; color: {{k.fg}}; font: inherit; font-size: 14px; font-weight: {{k.weight}}; min-height: 38px; border-radius: 9px; box-shadow: {{k.shadow}}">{{k.label}}</button>
      </sc-for>
    </div>

    <section aria-label="金額" style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; min-height: 64px">
      <span style="width: 44px; height: 44px; border-radius: 14px; background: {{cur.color}}; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{cur.icon}}"></path></svg>
      </span>
      <span style="font-size: 15px; font-weight: 700">{{cur.name}}</span>
      <span style="flex: 1; display: flex; flex-direction: column; align-items: flex-end; min-width: 0">
        <small style="font-size: 12px; color: {{t.muted}}; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%">{{exprText}}</small>
        <b aria-live="polite" style="font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; color: {{amountColor}}">{{amountText}}</b>
      </span>
    </section>

    <sc-if value="{{showCats}}" hint-placeholder-val="{{true}}">
      <section aria-label="類別" style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 20px; padding: 10px 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); row-gap: 6px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="10">
          <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="border: 0; background: transparent; font: inherit; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 4px 0; min-height: 64px; color: {{c.fg}}">
            <span style="width: 40px; height: 40px; border-radius: 13px; background: {{c.color}}; display: flex; align-items: center; justify-content: center; box-shadow: {{c.ring}}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
            </span>
            <span style="font-size: 12px; font-weight: {{c.weight}}">{{c.name}}</span>
          </button>
        </sc-for>
      </section>
    </sc-if>

    <sc-if value="{{showTransfer}}" hint-placeholder-val="{{false}}">
      <section aria-label="轉帳帳戶" style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 20px; padding: 6px 14px; display: flex; flex-direction: column">
        <button type="button" style="border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; min-height: 52px; color: {{t.text}}; border-bottom: 1px solid {{t.line}}; text-align: left">
          <span style="font-size: 13px; color: {{t.muted}}; width: 40px">轉出</span>
          <b style="flex: 1; font-size: 15px; font-weight: 700">台新 Richart</b>
          <span style="font-size: 13px; color: {{t.muted}}">$286,540</span>
        </button>
        <button type="button" style="border: 0; background: transparent; font: inherit; display: flex; align-items: center; gap: 10px; min-height: 52px; color: {{t.text}}; text-align: left">
          <span style="font-size: 13px; color: {{t.muted}}; width: 40px">轉入</span>
          <b style="flex: 1; font-size: 15px; font-weight: 700">元大交割戶</b>
          <span style="font-size: 13px; color: {{t.muted}}">$438,360</span>
        </button>
      </section>
    </sc-if>

    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 16px; border: 1px solid {{t.border}}; background: {{t.surface}}; font: inherit; font-size: 14px; font-weight: 600; color: {{t.text}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zm0 0a2 2 0 0 1 2-2h13v4 M16 14h.01"></path></svg>
        現金
      </button>
      <button type="button" style="flex: 1; display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 16px; border: 1px solid {{t.border}}; background: {{t.surface}}; font: inherit; font-size: 14px; font-weight: 600; color: {{t.text}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4"></path></svg>
        今天 10/22
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 16px; border: 1px solid {{t.border}}; background: {{t.surface}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z M8 9h8 M8 13h8 M8 17h5"></path></svg>
      <input type="text" placeholder="名稱、商家或備註" aria-label="名稱、商家或備註" style="border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; flex: 1; min-width: 0; color: {{t.text}}">
    </label>
  </div>

  <section aria-label="數字鍵盤" style="margin-top: auto; padding: 10px 10px 24px; background: {{t.keypadBg}}; border-top: 1px solid {{t.border}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{keys}}" as="key" hint-placeholder-count="16">
      <button type="button" aria-label="{{key.aria}}" onClick="{{key.press}}" style="border: 0; min-height: 52px; border-radius: 12px; background: {{key.bg}}; color: {{key.fg}}; font: inherit; font-size: 22px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: {{t.keyShadow}}">{{key.label}}</button>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'expense', cat: 'food', expr: '185' };
  }

  evalExpr(expr) {
    const tokens = expr.match(/(\d+\.?\d*|\.\d+|[+−×÷])/g) || [];
    const num = (x) => (x === undefined || isNaN(parseFloat(x)) ? null : parseFloat(x));
    const first = num(tokens[0]);
    if (first === null) return 0;
    const vals = [first];
    const ops = [];
    let i = 1;
    while (i < tokens.length) {
      const op = tokens[i];
      const n = num(tokens[i + 1]);
      if (n === null) break;
      if (op === '×') vals.push(vals.pop() * n);
      else if (op === '÷') vals.push(n === 0 ? vals.pop() : vals.pop() / n);
      else { ops.push(op); vals.push(n); }
      i += 2;
    }
    let total = vals[0];
    for (let j = 0; j < ops.length; j++) total = ops[j] === '+' ? total + vals[j + 1] : total - vals[j + 1];
    return Math.round(total * 100) / 100;
  }

  renderVals() {
    const dark = !!(this.props.dark ?? false);
    const t = dark ? {
      bg: '#0f1218', surface: '#171c24', soft: '#202733', border: '#313a48', line: '#252c38',
      text: '#f3f6fb', muted: '#99a3b3', primary: '#8b7dff', out: '#ff6369', in: '#43c98a',
      shadow: '0 12px 28px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05)', pillOn: '#2a3241',
      keypadBg: '#0b0e13', key: '#202733', keyOp: '#2a3241', keyShadow: 'none', ringGap: '#171c24'
    } : {
      bg: '#f1f3f6', surface: '#fafcff', soft: '#edf1f6', border: '#d8dee7', line: '#e8ecf2',
      text: '#151821', muted: '#6b7280', primary: '#533afd', out: '#e5484d', in: '#1f9d6b',
      shadow: '0 10px 30px rgba(18,26,40,0.045), inset 0 1px 0 rgba(255,255,255,0.62)', pillOn: '#fafcff',
      keypadBg: '#e4e8ee', key: '#fafcff', keyOp: '#edf1f6', keyShadow: '0 1px 0 rgba(18,26,40,0.08)', ringGap: '#fafcff'
    };
    const { kind, cat, expr } = this.state;
    const I = {
      food: 'M7 3v8 M4 3v5a3 3 0 0 0 6 0V3 M7 11v10 M17 3c-2 2-3 4-3 7h3v11',
      coffee: 'M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z M17 10h1.5a2.5 2.5 0 0 1 0 5H17 M8 3v3 M12 3v3',
      bus: 'M5 16V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10 M5 11h14 M5 16h14v2H5z M8 21v-3 M16 21v-3',
      bag: 'M6 7h12l1 14H5L6 7z M9 7a3 3 0 0 1 6 0',
      home: 'M3 11l9-7 9 7 M5 10v10h14V10',
      film: 'M4 5h16v14H4z M4 9h16 M4 15h16 M8 5v4 M16 5v4 M8 15v4 M16 15v4',
      heart: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
      book: 'M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2V5z M4 19a2 2 0 0 1 2-2h14',
      gift: 'M4 10h16v10H4z M3 7h18v3H3z M12 7v13 M12 7c-2-4-6-4-6-1s6 1 6 1c2-4 6-4 6-1s-6 1-6 1',
      more: 'M6 12h.01 M12 12h.01 M18 12h.01',
      brief: 'M4 8h16v11H4z M9 8V5h6v3 M4 13h16',
      star: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z',
      percent: 'M19 5L5 19 M6.5 6.5h.01 M17.5 17.5h.01',
      coin: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v10 M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4',
      transfer: 'M7 7h13 M16 3l4 4-4 4 M17 17H4 M8 13l-4 4 4 4'
    };
    const EXP = [
      ['food', '餐飲', I.food, '#d0864a'], ['drink', '飲品', I.coffee, '#a88a5c'], ['traffic', '交通', I.bus, '#5f86c9'],
      ['daily', '日用', I.bag, '#4f9a72'], ['house', '居家', I.home, '#4f8f8a'], ['fun', '娛樂', I.film, '#8a7cc4'],
      ['health', '醫療', I.heart, '#c86f78'], ['learn', '學習', I.book, '#5a95bd'], ['gift', '禮物', I.gift, '#b9789f'], ['more', '更多', I.more, '#8a94a6']
    ];
    const INC = [
      ['salary', '薪資', I.brief, '#3f9d7a'], ['bonus', '獎金', I.star, '#b7843f'], ['div', '股利', I.percent, '#7e78a8'],
      ['interest', '利息', I.coin, '#4f8f8a'], ['more-in', '更多', I.more, '#8a94a6']
    ];
    const list = kind === 'income' ? INC : EXP;
    const selId = list.some((c) => c[0] === cat) ? cat : list[0][0];
    const cats = list.map(([id, name, icon, color]) => {
      const on = id === selId;
      return { name, icon, color, on: on ? 'true' : 'false', weight: on ? 800 : 500, fg: on ? t.text : t.muted,
        ring: on ? '0 0 0 2px ' + t.ringGap + ', 0 0 0 4px ' + color : 'none',
        pick: () => this.setState({ cat: id }) };
    });
    const selCat = list.find((c) => c[0] === selId);
    const cur = kind === 'transfer'
      ? { name: '轉帳', icon: I.transfer, color: '#7d889c' }
      : { name: selCat[1], icon: selCat[2], color: selCat[3] };

    const kinds = [['expense', '支出'], ['income', '收入'], ['transfer', '轉帳']].map(([id, label]) => {
      const on = id === kind;
      return { label, on: on ? 'true' : 'false', bg: on ? t.pillOn : 'transparent', fg: on ? t.text : t.muted, weight: on ? 700 : 500,
        shadow: on ? '0 1px 2px rgba(0,0,0,.08)' : 'none',
        pick: () => this.setState({ kind: id, cat: id === 'income' ? 'salary' : 'food' }) };
    });

    const isOp = (ch) => '+−×÷'.indexOf(ch) >= 0;
    const press = (k) => () => {
      let e = this.state.expr;
      if (k === 'back') e = e.slice(0, -1);
      else if (isOp(k)) e = e === '' ? e : (isOp(e.slice(-1)) ? e.slice(0, -1) + k : e + k);
      else if (k === '.') { const seg = e.split(/[+−×÷]/).pop(); if (seg.indexOf('.') < 0) e = e + (seg === '' ? '0.' : '.'); }
      else e = (e === '0' ? '' : e) + k;
      if (e.length > 24) return;
      this.setState({ expr: e });
    };
    const KEY = (label, k, op, aria) => ({ label, aria: aria || label, press: press(k), bg: op ? t.keyOp : t.key, fg: op ? t.primary : t.text });
    const keys = [
      KEY('7', '7'), KEY('8', '8'), KEY('9', '9'), KEY('÷', '÷', true, '除'),
      KEY('4', '4'), KEY('5', '5'), KEY('6', '6'), KEY('×', '×', true, '乘'),
      KEY('1', '1'), KEY('2', '2'), KEY('3', '3'), KEY('−', '−', true, '減'),
      KEY('.', '.', false, '小數點'), KEY('0', '0'), KEY('⌫', 'back', true, '刪除'), KEY('+', '+', true, '加')
    ];

    const total = this.evalExpr(expr);
    const hasOp = /[+−×÷]/.test(expr);
    const sign = kind === 'expense' ? '−' : kind === 'income' ? '+' : '';
    const amountText = sign + '$' + total.toLocaleString('en-US', { maximumFractionDigits: 2 });
    const amountColor = kind === 'income' ? t.in : kind === 'expense' ? t.out : t.text;

    return {
      t, kinds, cats, cur, keys, amountText, amountColor,
      exprText: hasOp ? expr + ' =' : ' ',
      showCats: kind !== 'transfer', showTransfer: kind === 'transfer'
    };
  }
}
</script>
</body>
</html>
