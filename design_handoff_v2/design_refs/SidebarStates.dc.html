<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>側欄狀態對照</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1000px; height: 920px; box-sizing: border-box; padding: 32px; display: flex; gap: 40px; background: {{t.canvas}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500">

  <sc-for list="{{panels}}" as="p" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 12px; width: 248px">
      <div style="display: flex; flex-direction: column; gap: 2px; min-height: 44px">
        <b style="font-size: 16px; font-weight: 800">{{p.title}}</b>
        <span style="font-size: 12px; color: {{t.muted}}">{{p.sub}}</span>
      </div>
      <aside aria-label="{{p.title}}" style="flex: 1; box-sizing: border-box; background: {{t.glass}}; border: 1px solid {{t.border}}; border-radius: 16px; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
        <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px 0 8px">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.onAccent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7 M5 10v10h14V10"></path></svg>
          </span>
          <b style="flex: 1; font-size: 16px; font-weight: 800">Home Hub</b>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z M9 4v16 M15 10l-2 2 2 2"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{p.groups}}" as="g" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <div style="display: flex; align-items: center; justify-content: space-between; min-height: 30px; padding: 0 10px; color: {{t.muted}}">
                <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em">{{g.label}}</span>
                <span style="display: flex; align-items: center; gap: 6px">
                  <sc-if value="{{g.showSum}}" hint-placeholder-val="{{false}}">
                    <span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{t.primarySoft}}; color: {{t.primary}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{g.sum}}</span>
                  </sc-if>
                  <sc-if value="{{g.showDot}}" hint-placeholder-val="{{false}}">
                    <span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.red}}"></span>
                  </sc-if>
                  <span style="font-size: 11px; font-weight: 600">{{g.hint}}</span>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="transform: rotate({{g.rot}}); opacity: {{g.chevOpacity}}"><path d="M6 9l6 6 6-6"></path></svg>
                </span>
              </div>
              <sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
                <sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
                  <div style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: 12px; background: {{item.bg}}; color: {{item.fg}}; font-weight: {{item.weight}}; font-size: 14px">
                    <span style="width: 26px; height: 26px; border-radius: 8px; background: {{item.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none">
                      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{item.iconFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
                    </span>
                    <span style="flex: 1">{{item.label}}</span>
                    <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
                      <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{t.primary}}; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{item.count}}</span>
                    </sc-if>
                    <sc-if value="{{item.hasDot}}" hint-placeholder-val="{{false}}">
                      <span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.red}}"></span>
                    </sc-if>
                  </div>
                </sc-for>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </aside>
    </div>
  </sc-for>

  <!-- 圖示欄 -->
  <div style="display: flex; flex-direction: column; gap: 12px; width: 300px">
    <div style="display: flex; flex-direction: column; gap: 2px; min-height: 44px">
      <b style="font-size: 16px; font-weight: 800">圖示欄 · 760–1279px</b>
      <span style="font-size: 12px; color: {{t.muted}}">或記帳頁開啟明細時自動收合；滑過顯示名稱</span>
    </div>
    <div style="flex: 1; display: flex">
      <aside aria-label="圖示欄" style="width: 72px; box-sizing: border-box; background: {{t.glass}}; border: 1px solid {{t.border}}; border-radius: 16px; padding: 18px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.onAccent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7 M5 10v10h14V10"></path></svg>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin: 6px 0"><path d="M4 4h16v16H4z M9 4v16 M13 10l2 2-2 2"></path></svg>
        <sc-for list="{{railGroups}}" as="g" hint-placeholder-count="4">
          <div style="width: 32px; height: 1px; background: {{t.border}}; margin: 4px 0"></div>
          <sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
            <div style="position: relative; width: 44px; height: 38px; border-radius: 12px; background: {{item.bg}}; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{item.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
              <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; top: 0; right: 1px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: {{t.primary}}; color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{item.count}}</span>
              </sc-if>
              <sc-if value="{{item.hasDot}}" hint-placeholder-val="{{false}}">
                <span style="position: absolute; top: 5px; right: 8px; width: 8px; height: 8px; border-radius: 4px; background: {{t.red}}; box-shadow: 0 0 0 2px {{t.surface}}"></span>
              </sc-if>
              <sc-if value="{{item.tip}}" hint-placeholder-val="{{false}}">
                <span role="tooltip" style="position: absolute; left: 54px; top: 50%; transform: translateY(-50%); white-space: nowrap; padding: 6px 10px; border-radius: 8px; background: {{t.tipBg}}; color: {{t.tipFg}}; font-size: 13px; font-weight: 600; box-shadow: {{t.raised}}">{{item.tipText}}</span>
              </sc-if>
            </div>
          </sc-for>
        </sc-for>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1000,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!(this.props.dark ?? false);
    const t = dark ? {
      canvas: '#0b0e13', glass: '#171c24', surface: '#171c24', soft: '#202733', border: '#313a48',
      text: '#f3f6fb', muted: '#99a3b3', accent: '#e6ebf5', onAccent: '#171c24',
      primary: '#8b7dff', primarySoft: 'rgba(139,125,255,0.16)', red: '#ff6369',
      raised: '0 20px 40px rgba(0,0,0,0.5)', tipBg: '#e6ebf5', tipFg: '#151821'
    } : {
      canvas: '#f1f3f6', glass: '#fafcff', surface: '#fafcff', soft: '#edf1f6', border: '#d8dee7',
      text: '#151821', muted: '#6b7280', accent: '#1d2433', onAccent: '#ffffff',
      primary: '#533afd', primarySoft: 'rgba(83,58,253,0.10)', red: '#e5484d',
      raised: '0 16px 36px rgba(18,26,40,0.09)', tipBg: '#1d2433', tipFg: '#ffffff'
    };
    const I = {
      box: 'M21 8l-9-5-9 5v8l9 5 9-5V8z M3 8l9 5 9-5 M12 13v8',
      cart: 'M3 4h2l2.4 11h11.2L21 7H6.2 M9 20h.01 M18 20h.01',
      chart: 'M3 17l6-6 4 4 8-8 M15 7h6v6',
      list: 'M8 6h13 M8 12h13 M8 18h13 M3.5 6h.01 M3.5 12h.01 M3.5 18h.01',
      percent: 'M19 5L5 19 M6.5 6.5h.01 M17.5 17.5h.01',
      dollar: 'M12 3v18 M16.5 7.5c0-1.9-2-3-4.5-3s-4.5 1.1-4.5 3 2 2.7 4.5 3.2 4.5 1.3 4.5 3.3-2 3.5-4.5 3.5-4.5-1.3-4.5-3.3',
      wallet: 'M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zm0 0a2 2 0 0 1 2-2h13v4 M16 14h.01',
      upload: 'M12 16V4 M7 9l5-5 5 5 M4 20h16',
      sliders: 'M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M16 4v4 M10 10v4 M18 16v4',
      cog: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M2 12h3 M19 12h3 M4.9 19.1L7 17 M17 7l2.1-2.1'
    };
    const activeId = 'ledger';
    const NAV = [
      { id: 'portfolio', label: '投資', items: [
        ['portfolio', '投資概覽', I.chart], ['transactions', '交易紀錄', I.list], ['dividends', '股利', I.percent, { count: 2 }],
        ['realized', '已實現損益', I.dollar], ['cash', '現金帳戶', I.wallet], ['import', '匯入', I.upload, { dot: true }]
      ] },
      { id: 'ledger', label: '財務', items: [['ledger', '記帳記錄', I.list, { count: 2 }], ['accounts', '帳戶', I.wallet, { count: 1 }], ['ledger-settings', '記帳設定', I.sliders]] },
      { id: 'system', label: '系統', items: [['settings', '設定', I.cog]] }
    ];
    const mkItem = ([id, label, icon, b]) => {
      const on = id === activeId;
      const badge = b || {};
      return { id, label, icon,
        bg: on ? t.primarySoft : 'transparent', fg: on ? t.primary : t.text, weight: on ? 700 : 500,
        iconBg: on ? t.primary : t.soft, iconFg: on ? '#FFFFFF' : t.muted,
        hasCount: !!badge.count, count: badge.count || '', hasDot: !!badge.dot };
    };
    const build = (closedIds) => NAV.map((g) => {
      const items = g.items.map(mkItem);
      const isActive = items.some((it) => it.id === activeId);
      const open = isActive || closedIds.indexOf(g.id) < 0;
      const sum = items.reduce((s, it) => s + (Number(it.count) || 0), 0);
      return { label: g.label, items, open,
        rot: open ? '0deg' : '-90deg', chevOpacity: isActive ? 0 : 1, hint: isActive ? '目前' : '',
        showSum: !open && sum > 0, sum, showDot: !open && items.some((it) => it.hasDot) };
    });
    const panels = [
      { title: '展開 · ≥1280px', sub: '全部分組展開，待處理事項顯示數字', groups: build([]) },
      { title: '分組折疊', sub: '目前所在組固定展開；折起的組彙總標記', groups: build(['supplies', 'portfolio']) }
    ];
    const railGroups = NAV.map((g) => ({
      items: g.items.map(mkItem).map((it) => ({
        ...it,
        bg: it.id === activeId ? t.primarySoft : 'transparent',
        fg: it.id === activeId ? t.primary : t.muted,
        tip: it.id === 'accounts',
        tipText: it.label + (it.hasCount ? ' · 待確認 ' + it.count : '')
      }))
    }));
    return { t, panels, railGroups };
  }
}
</script>
</body>
</html>
