<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>現金帳戶 · 桌面</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500">

  <!-- ===== 側欄導覽 ===== -->
  <aside aria-label="主要導覽" style="flex: 1 1 248px; max-width: 100%; box-sizing: border-box; background: {{t.glass}}; border-right: 1px solid {{t.border}}; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px">
      <a href="#" style="flex: 1; display: flex; align-items: center; gap: 10px; color: {{t.text}}; text-decoration: none">
        <span style="width: 36px; height: 36px; border-radius: 12px; background: {{t.accent}}; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.onAccent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7 M5 10v10h14V10"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column">
          <b style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em">Home Hub</b>
          <small style="font-size: 12px; color: {{t.muted}}">家庭服務中樞</small>
        </span>
      </a>
      <button type="button" aria-label="收合側欄" style="width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z M9 4v16 M15 10l-2 2 2 2"></path></svg>
      </button>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <button type="button" aria-expanded="{{g.ariaOpen}}" onClick="{{g.toggle}}" style="border: 0; background: transparent; font: inherit; display: flex; align-items: center; justify-content: space-between; min-height: 30px; padding: 0 10px; color: {{t.muted}}">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em">{{g.label}}</span>
            <span style="display: flex; align-items: center; gap: 6px">
              <sc-if value="{{g.showSum}}" hint-placeholder-val="{{false}}">
                <span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{t.primarySoft}}; color: {{t.primary}}; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{g.sum}}</span>
              </sc-if>
              <sc-if value="{{g.showDot}}" hint-placeholder-val="{{false}}">
                <span style="width: 8px; height: 8px; border-radius: 4px; background: {{t.red}}"></span>
              </sc-if>
              <span style="font-size: 11px; font-weight: 600">{{g.hint}}</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="transform: rotate({{g.rot}}); opacity: {{g.chevOpacity}}"><path d="M6 9l6 6 6-6"></path></svg>
            </span>
          </button>
          <sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
            <sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
              <a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 12px; background: {{item.bg}}; color: {{item.fg}}; font-weight: {{item.weight}}; font-size: 14px; text-decoration: none">
                <span style="width: 26px; height: 26px; border-radius: 8px; background: {{item.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{item.iconFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.icon}}"></path></svg>
                </span>
                <span style="flex: 1">{{item.label}}</span>
                <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}">
                  <span aria-label="{{item.badgeAria}}" style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{t.primary}}; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{item.count}}</span>
                </sc-if>
                <sc-if value="{{item.hasDot}}" hint-placeholder-val="{{false}}">
                  <span aria-label="{{item.badgeAria}}" style="width: 8px; height: 8px; border-radius: 4px; background: {{t.red}}"></span>
                </sc-if>
              </a>
            </sc-for>
          </sc-if>
        </div>
      </sc-for>
    </nav>
  </aside>

  <!-- ===== 主內容 ===== -->
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px 112px">
    <div style="max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">

      <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">現金帳戶</h1>
          <span style="font-size: 13px; color: {{t.muted}}">券商交割戶與複委託帳戶的現金</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 12px; background: {{t.surface}}; border: 1px solid {{t.border}}; color: {{t.text}}; font: inherit; font-size: 14px; font-weight: 600">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13 M16 3l4 4-4 4 M17 17H4 M8 13l-4 4 4 4"></path></svg>
            記錄入出金
          </button>
          <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 0; background: {{t.primarySoft}}; color: {{t.primary}}; font: inherit; font-size: 14px; font-weight: 700">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
            新增帳戶
          </button>
        </div>
      </header>

      <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">

        <!-- 左：帳戶列表 -->
        <section aria-label="帳戶列表" style="flex: 1 1 280px; max-width: 360px; display: flex; flex-direction: column; gap: 12px">
          <div style="background: {{t.hero}}; color: {{t.onHero}}; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: {{t.shadow}}">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; opacity: .8">現金帳戶總額 · TWD</span>
            <b style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em">$438,360</b>
            <span style="font-size: 12px; opacity: .8">1 個帳戶待補入金紀錄，未計入</span>
          </div>
          <sc-for list="{{accounts}}" as="a" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{a.on}}" style="border: 2px solid {{a.ring}}; background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 18px; padding: 14px 16px; font: inherit; color: {{t.text}}; text-align: left; display: flex; flex-direction: column; gap: 10px">
              <span style="display: flex; align-items: center; gap: 12px; width: 100%">
                <span style="width: 40px; height: 40px; border-radius: 12px; background: {{a.color}}; display: flex; align-items: center; justify-content: center; flex: none">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-6 9 6 M5 10v8 M10 10v8 M14 10v8 M19 10v8 M3 20h18"></path></svg>
                </span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <b style="font-size: 15px; font-weight: 700">{{a.name}}</b>
                  <small style="font-size: 12px; color: {{t.muted}}">{{a.meta}}</small>
                </span>
              </span>
              <span style="display: flex; align-items: center; justify-content: space-between; width: 100%">
                <b style="font-size: 18px; font-weight: 800; color: {{a.balColor}}">{{a.bal}}</b>
                <sc-if value="{{a.hasTag}}" hint-placeholder-val="{{false}}">
                  <span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px; background: {{t.redSoft}}; color: {{t.text}}">{{a.tag}}</span>
                </sc-if>
              </span>
            </button>
          </sc-for>
        </section>

        <!-- 右：帳戶明細 -->
        <section aria-label="帳戶明細" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
          <div style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 20px; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="display: flex; align-items: center; gap: 8px">
                <h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">元大交割戶</h2>
                <span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: {{t.successSoft}}; color: {{t.text}}">啟用中</span>
              </span>
              <span style="font-size: 13px; color: {{t.muted}}">元大證券 · TWD · 期初 300,000（2026/01/02）</span>
            </div>
            <div style="display: flex; align-items: center; gap: 16px">
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
                <span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">目前餘額</span>
                <b style="font-size: 28px; font-weight: 800; letter-spacing: -0.03em">438,360</b>
              </div>
              <button type="button" aria-label="編輯帳戶" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
              </button>
            </div>
          </div>

          <div style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 20px; padding: 18px 22px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap">
              <h3 style="margin: 0; font-size: 16px; font-weight: 800">餘額走勢</h3>
              <div role="radiogroup" aria-label="區間" style="display: flex; background: {{t.soft}}; border-radius: 10px; padding: 3px; gap: 2px">
                <sc-for list="{{ranges}}" as="r" hint-placeholder-count="4">
                  <button type="button" role="radio" aria-checked="{{r.on}}" style="border: 0; background: {{r.bg}}; color: {{r.fg}}; font: inherit; font-size: 13px; font-weight: {{r.weight}}; min-height: 32px; min-width: 44px; border-radius: 8px; box-shadow: {{r.shadow}}">{{r.label}}</button>
                </sc-for>
              </div>
            </div>
            <svg width="100%" viewBox="0 0 700 210" role="img" aria-label="{{chartAria}}" style="display: block">
              <line x1="40" y1="20" x2="690" y2="20" stroke="{{t.line}}" stroke-width="1"></line>
              <line x1="40" y1="100" x2="690" y2="100" stroke="{{t.line}}" stroke-width="1"></line>
              <line x1="40" y1="180" x2="690" y2="180" stroke="{{t.line}}" stroke-width="1"></line>
              <text x="0" y="24" font-size="11" fill="{{t.muted}}">650k</text>
              <text x="0" y="104" font-size="11" fill="{{t.muted}}">475k</text>
              <text x="0" y="184" font-size="11" fill="{{t.muted}}">300k</text>
              <path d="{{areaPath}}" fill="{{t.primarySoft}}"></path>
              <path d="{{stepPath}}" fill="none" stroke="{{t.primary}}" stroke-width="2.2" stroke-linejoin="round"></path>
              <text x="40" y="204" font-size="11" fill="{{t.muted}}">4/22</text>
              <text x="257" y="204" font-size="11" text-anchor="middle" fill="{{t.muted}}">6/22</text>
              <text x="478" y="204" font-size="11" text-anchor="middle" fill="{{t.muted}}">8/22</text>
              <text x="690" y="204" font-size="11" text-anchor="end" fill="{{t.muted}}">10/22</text>
            </svg>
          </div>

          <div style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 20px; overflow: hidden">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px 10px">
              <h3 style="margin: 0; font-size: 16px; font-weight: 800">現金交易</h3>
              <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                <button type="button" role="switch" aria-checked="true" style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600">
                  <span style="width: 34px; height: 20px; border-radius: 10px; background: {{t.primary}}; position: relative; display: inline-block"><span style="position: absolute; top: 2px; left: 16px; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></span></span>
                  合併同筆交易
                </button>
                <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
                  <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600">
                    <span style="color: {{t.muted}}; font-weight: 500">{{c.k}}</span>{{c.v}}
                  </button>
                </sc-for>
                <button type="button" style="display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 0; background: {{t.primarySoft}}; color: {{t.primary}}; font: inherit; font-size: 13px; font-weight: 700">＋ 新增交易</button>
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 90px 120px 110px; gap: 12px; padding: 8px 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: {{t.muted}}; border-top: 1px solid {{t.line}}; border-bottom: 1px solid {{t.line}}">
              <span>日期</span><span>項目</span><span>來源</span><span style="text-align: right">金額</span><span style="text-align: right">餘額</span>
            </div>
            <sc-for list="{{txns}}" as="x" hint-placeholder-count="8">
              <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 90px 120px 110px; gap: 12px; align-items: center; padding: 10px 20px; min-height: 56px; border-bottom: 1px solid {{t.line}}">
                <span style="font-size: 14px; font-weight: 600">{{x.date}}</span>
                <span style="display: flex; align-items: center; gap: 10px; min-width: 0">
                  <span style="width: 32px; height: 32px; border-radius: 10px; background: {{x.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{x.iconFg}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.icon}}"></path></svg>
                  </span>
                  <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                    <b style="font-size: 14px; font-weight: 700">{{x.title}}</b>
                    <small style="font-size: 12px; color: {{t.muted}}">{{x.sub}}</small>
                  </span>
                </span>
                <span><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: {{x.srcBg}}; color: {{x.srcFg}}">{{x.src}}</span></span>
                <b style="text-align: right; font-size: 15px; font-weight: 700; color: {{x.amtColor}}">{{x.amount}}</b>
                <span style="text-align: right; font-size: 13px; color: {{t.muted}}">{{x.bal}}</span>
              </div>
            </sc-for>
          </div>
        </section>
      </div>
    </div>
  </main>

  <!-- 記一筆：全站唯一入口，固定右下角 -->
  <div style="position: fixed; right: 32px; bottom: 32px; z-index: 20; display: flex; align-items: center; gap: 10px">
    <sc-if value="{{fabTip}}" hint-placeholder-val="{{false}}">
      <span role="tooltip" style="padding: 6px 10px; border-radius: 8px; background: {{t.tipBg}}; color: {{t.tipFg}}; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: {{t.raised}}">記一筆 <span style="margin-left: 4px; padding: 0 5px; border: 1px solid currentColor; border-radius: 5px; font-size: 11px; opacity: .75">N</span></span>
    </sc-if>
    <a href="EntryPhone.dc.html" aria-label="記一筆（快捷鍵 N）" onMouseEnter="{{fabEnter}}" onMouseLeave="{{fabLeave}}" onFocus="{{fabEnter}}" onBlur="{{fabLeave}}" style="width: 56px; height: 56px; border-radius: 28px; background: {{t.primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(83,58,253,.35); text-decoration: none">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!(this.props.dark ?? false);
    const t = dark ? {
      bg: '#0f1218', surface: '#171c24', glass: 'rgba(23,28,36,0.75)', soft: '#202733', border: '#313a48', line: '#252c38',
      text: '#f3f6fb', muted: '#99a3b3', accent: '#e6ebf5', onAccent: '#171c24',
      primary: '#8b7dff', primarySoft: 'rgba(139,125,255,0.16)', successSoft: 'rgba(141,174,199,0.15)', warnSoft: 'rgba(150,165,197,0.15)',
      red: '#ff6369', redSoft: 'rgba(255,99,105,0.16)', green: '#43c98a',
      buy: '#8b7dff', buySoft: 'rgba(139,125,255,0.16)', sell: '#9aa6bd', sellSoft: 'rgba(154,166,189,0.16)',
      dividend: '#aba6d0', dividendSoft: 'rgba(171,166,208,0.12)',
      shadow: '0 12px 28px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05)', raised: '0 20px 40px rgba(0,0,0,0.5)',
      pillOn: '#2a3241', tipBg: '#e6ebf5', tipFg: '#151821', hero: '#202733', onHero: '#f3f6fb'
    } : {
      bg: '#f1f3f6', surface: '#fafcff', glass: 'rgba(250,252,255,0.8)', soft: '#edf1f6', border: '#d8dee7', line: '#e8ecf2',
      text: '#151821', muted: '#6b7280', accent: '#1d2433', onAccent: '#ffffff',
      primary: '#533afd', primarySoft: 'rgba(83,58,253,0.10)', successSoft: 'rgba(95,127,152,0.12)', warnSoft: 'rgba(123,135,168,0.12)',
      red: '#e5484d', redSoft: 'rgba(229,72,77,0.12)', green: '#1f9d6b',
      buy: '#533afd', buySoft: 'rgba(83,58,253,0.10)', sell: '#51607a', sellSoft: 'rgba(81,96,121,0.12)',
      dividend: '#7e78a8', dividendSoft: 'rgba(126,120,168,0.12)',
      shadow: '0 10px 30px rgba(18,26,40,0.045), inset 0 1px 0 rgba(255,255,255,0.62)', raised: '0 16px 36px rgba(18,26,40,0.09)',
      pillOn: '#fafcff', tipBg: '#1d2433', tipFg: '#ffffff', hero: '#1d2433', onHero: '#ffffff'
    };

    // ===== 側欄（與其他桌面頁共用）=====
    const I = {
      box: 'M21 8l-9-5-9 5v8l9 5 9-5V8z M3 8l9 5 9-5 M12 13v8',
      cart: 'M3 4h2l2.4 11h11.2L21 7H6.2 M9 20h.01 M18 20h.01',
      chart: 'M3 17l6-6 4 4 8-8 M15 7h6v6',
      list: 'M8 6h13 M8 12h13 M8 18h13 M3.5 6h.01 M3.5 12h.01 M3.5 18h.01',
      percent: 'M19 5L5 19 M6.5 6.5h.01 M17.5 17.5h.01',
      dollar: 'M12 3v18 M16.5 7.5c0-1.9-2-3-4.5-3s-4.5 1.1-4.5 3 2 2.7 4.5 3.2 4.5 1.3 4.5 3.3-2 3.5-4.5 3.5-4.5-1.3-4.5-3.3',
      wallet: 'M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zm0 0a2 2 0 0 1 2-2h13v4 M16 14h.01',
      upload: 'M12 16V4 M7 9l5-5 5 5 M4 20h16',
      sliders: 'M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M16 4v4 M10 10v4 M18 16v4',
      cog: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M2 12h3 M19 12h3 M4.9 19.1L7 17 M17 7l2.1-2.1',
      down: 'M12 4v12 M7 11l5 5 5-5 M4 20h16',
      transfer: 'M7 7h13 M16 3l4 4-4 4 M17 17H4 M8 13l-4 4 4 4'
    };
    const activeId = 'cash';
    const NAV = [
      { id: 'portfolio', label: '投資', items: [
        ['portfolio', '投資概覽', I.chart, null, 'Main.dc.html'], ['transactions', '交易紀錄', I.list, null, 'PfTransactions.dc.html'],
        ['dividends', '股利', I.percent, { count: 2, aria: '2 筆待收股利' }, 'PfDividends.dc.html'],
        ['realized', '已實現損益', I.dollar, null, 'PfRealized.dc.html'], ['cash', '現金帳戶', I.wallet, null, 'PfCash.dc.html'],
        ['import', '匯入', I.upload, { dot: true, aria: '最近一次匯入失敗' }, 'PfImport.dc.html']
      ] },
      { id: 'ledger', label: '財務', items: [['ledger', '記帳記錄', I.list, { count: 2, aria: '提醒中心 2 項' }, 'AccountingDesktop.dc.html'], ['accounts', '帳戶', I.wallet, { count: 1, aria: '1 筆待確認' }], ['ledger-settings', '記帳設定', I.sliders]] },
      { id: 'system', label: '系統', items: [['settings', '設定', I.cog, null, 'SettingsDesktop.dc.html']] }
    ];
    const item = ([id, label, icon, b, href]) => {
      const on = id === activeId;
      const badge = b || {};
      return { id, label, icon, href: href || '#', current: on ? 'page' : 'false',
        bg: on ? t.primarySoft : 'transparent', fg: on ? t.primary : t.text, weight: on ? 700 : 500,
        iconBg: on ? t.primary : t.soft, iconFg: on ? '#FFFFFF' : t.muted,
        hasCount: !!badge.count, count: badge.count || '', hasDot: !!badge.dot, badgeAria: badge.aria || '' };
    };
    const st = this.state || {};
    const closed = st.closed || {};
    const groups = NAV.map((g) => {
      const items = g.items.map(item);
      const isActive = items.some((it) => it.id === activeId);
      const open = isActive || !closed[g.id];
      const sum = items.reduce((s, it) => s + (Number(it.count) || 0), 0);
      return { label: g.label, items, open, ariaOpen: open ? 'true' : 'false',
        rot: open ? '0deg' : '-90deg', chevOpacity: isActive ? 0 : 1, hint: isActive ? '目前' : '',
        showSum: !open && sum > 0, sum, showDot: !open && items.some((it) => it.hasDot),
        toggle: () => { if (!isActive) this.setState({ closed: { ...closed, [g.id]: !closed[g.id] } }); } };
    });

    // ===== 頁面（範例資料，僅示意）=====
    const sel = st.acc || 'yuanta';
    const accounts = [
      { id: 'yuanta', name: '元大交割戶', meta: '元大證券 · TWD', bal: '$438,360', color: dark ? '#8b7dff' : '#533afd', tag: '' },
      { id: 'cathay', name: '國泰複委託', meta: '國泰證券 · USD', bal: 'US$−2,379.54', color: '#4f8f8a', tag: '未記錄入金', neg: true }
    ].map((a) => ({ ...a, on: a.id === sel ? 'true' : 'false', ring: a.id === sel ? t.primary : 'transparent',
      hasTag: !!a.tag, balColor: a.neg ? t.red : t.text, pick: () => this.setState({ acc: a.id }) }));

    const ranges = ['1M', '3M', '6M', 'YTD'].map((label) => {
      const on = label === '6M';
      return { label, on: on ? 'true' : 'false', bg: on ? t.pillOn : 'transparent', fg: on ? t.text : t.muted, weight: on ? 700 : 500, shadow: on ? '0 1px 2px rgba(0,0,0,.08)' : 'none' };
    });
    // 餘額事件（距 4/22 的天數, 變動後餘額）
    const events = [[0, 518815], [13, 618815], [103, 458087], [113, 465127], [114, 473117], [120, 490507], [125, 492537], [139, 354541], [167, 528767], [178, 418360], [181, 438360], [183, 438360]];
    const X = (d) => 40 + d / 183 * 650;
    const Y = (v) => 180 - (v - 300000) / 350000 * 160;
    let stepPath = 'M' + X(0).toFixed(1) + ' ' + Y(events[0][1]).toFixed(1);
    for (let i = 1; i < events.length; i++) {
      stepPath += ' L' + X(events[i][0]).toFixed(1) + ' ' + Y(events[i - 1][1]).toFixed(1) + ' L' + X(events[i][0]).toFixed(1) + ' ' + Y(events[i][1]).toFixed(1);
    }
    const areaPath = stepPath + ' L' + X(183).toFixed(1) + ' 180 L' + X(0).toFixed(1) + ' 180 Z';
    const chartAria = '近 6 個月元大交割戶餘額，由 518,815 變為 438,360，最低 354,541（9/8）';
    const chips = [{ k: '日期', v: '近 6 個月' }, { k: '類型', v: '全部' }];

    const TYPE = {
      deposit: { icon: I.down, bg: t.successSoft, fg: t.text },
      buy: { icon: I.chart, bg: t.buySoft, fg: t.buy },
      sell: { icon: I.chart, bg: t.sellSoft, fg: t.sell },
      div: { icon: I.percent, bg: t.dividendSoft, fg: t.dividend }
    };
    const SRC = { '手動': [t.soft, t.text], '交易': [t.buySoft, t.buy], '股利': [t.dividendSoft, t.dividend], '匯入': [t.warnSoft, t.text] };
    const txns = [
      { date: '10/20', k: 'deposit', title: '入金', sub: '從台新 Richart 轉入', src: '手動', amount: '+20,000', bal: '438,360' },
      { date: '10/17', k: 'buy', title: '交割 · 買進 00878', sub: '5,000 股 · 10/15 成交', src: '交易', amount: '−110,407', bal: '418,360' },
      { date: '10/06', k: 'sell', title: '交割 · 賣出 2317', sub: '1,000 股 · 10/02 成交', src: '交易', amount: '+174,226', bal: '528,767' },
      { date: '09/08', k: 'buy', title: '交割 · 買進 0050', sub: '2,000 股 · 09/04 成交', src: '交易', amount: '−137,996', bal: '354,541' },
      { date: '08/25', k: 'sell', title: '交割 · 當沖 2330', sub: '已合併買賣 2 筆 · 08/21 成交', src: '交易', amount: '+2,030', bal: '492,537' },
      { date: '08/20', k: 'div', title: '股利 · 鴻海', sub: '5.80 × 3,000 · 扣匯費 10', src: '股利', amount: '+17,390', bal: '490,507' },
      { date: '08/14', k: 'div', title: '股利 · 元大台灣50', sub: '1.335 × 6,000 · 扣匯費 20', src: '股利', amount: '+7,990', bal: '473,117' },
      { date: '08/13', k: 'div', title: '股利 · 國泰永續高股息', sub: '0.47 × 15,000 · 扣匯費 10', src: '股利', amount: '+7,040', bal: '465,127' }
    ].map((x) => ({ ...x, icon: TYPE[x.k].icon, iconBg: TYPE[x.k].bg, iconFg: TYPE[x.k].fg,
      srcBg: SRC[x.src][0], srcFg: SRC[x.src][1], amtColor: x.amount.charAt(0) === '+' ? t.text : t.text }));

    return { t, groups, accounts, ranges, stepPath, areaPath, chartAria, chips, txns,
      fabTip: !!st.fabTip, fabEnter: () => this.setState({ fabTip: true }), fabLeave: () => this.setState({ fabTip: false }) };
  }
}
</script>
