<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>記帳時間軸 · 手機</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 1220px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500">
  <div style="padding: 20px 16px 110px; display: flex; flex-direction: column; gap: 12px">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.03em">財務</h1>
      <a href="SettingsPhone.dc.html" aria-label="設定" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{t.border}}; box-sizing: border-box; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M12 2v3 M12 19v3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M2 12h3 M19 12h3 M4.9 19.1L7 17 M17 7l2.1-2.1"></path></svg>
      </a>
    </div>
    <nav aria-label="財務頁面" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: {{t.soft}}; border-radius: 12px; padding: 3px; gap: 2px">
      <sc-for list="{{subTabs}}" as="s" hint-placeholder-count="3">
        <a href="{{s.href}}" aria-current="{{s.current}}" aria-label="{{s.aria}}" style="background: {{s.bg}}; color: {{s.fg}}; font-size: 14px; font-weight: {{s.weight}}; min-height: 40px; border-radius: 9px; box-shadow: {{s.shadow}}; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">
          {{s.label}}
          <sc-if value="{{s.hasCount}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{t.primary}}; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{s.count}}</span>
          </sc-if>
        </a>
      </sc-for>
    </nav>

    <header style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 2px">
        <button type="button" aria-label="上個月" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <h2 style="margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">2026 年 10 月</h2>
        <button type="button" aria-label="下個月" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
      </div>
      <div style="display: flex; gap: 6px">
        <button type="button" aria-label="搜尋與篩選" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14z M20 20l-4-4"></path></svg>
        </button>
        <button type="button" aria-label="提醒中心，2 項" style="position: relative; width: 44px; height: 44px; border-radius: 22px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9 M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          <span aria-hidden="true" style="position: absolute; top: 3px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: {{t.primary}}; color: #FFFFFF; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span>
        </button>
      </div>
    </header>

    <section aria-label="本月摘要" style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: {{t.muted}}">本月支出</span>
          <b style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: {{t.out}}">$38,460</b>
        </div>
        <div role="radiogroup" aria-label="檢視模式" style="display: flex; background: {{t.soft}}; border-radius: 10px; padding: 2px">
          <button type="button" role="radio" aria-checked="true" style="border: 0; background: {{t.pillOn}}; font: inherit; font-size: 13px; font-weight: 700; min-height: 32px; padding: 0 12px; border-radius: 8px; color: {{t.text}}; box-shadow: 0 1px 2px rgba(0,0,0,.08)">清單</button>
          <button type="button" role="radio" aria-checked="false" style="border: 0; background: transparent; font: inherit; font-size: 13px; min-height: 32px; padding: 0 12px; border-radius: 8px; color: {{t.muted}}">日曆</button>
        </div>
      </div>
      <div style="display: flex; height: 8px; border-radius: 999px; overflow: hidden; gap: 2px" role="img" aria-label="支出類別分佈">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <span style="flex: {{c.amt}}; background: {{c.color}}"></span>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; border-top: 1px solid {{t.line}}">
        <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px">
          <span style="font-size: 12px; color: {{t.muted}}">收入</span>
          <b style="font-size: 17px; font-weight: 800; color: {{t.in}}">$72,000</b>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 10px">
          <span style="font-size: 12px; color: {{t.muted}}">結餘</span>
          <b style="font-size: 17px; font-weight: 800">+$33,540</b>
        </div>
      </div>
    </section>

    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 16px; border: 0; background: {{t.primarySoft}}; color: {{t.text}}; font: inherit; font-size: 13px; font-weight: 600; text-align: left">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.primary}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3z M3 10h18 M7 15h3"></path></svg>
      <span style="flex: 1">玉山 Pi 卡 $12,860 · 11/05 到期</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </button>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <section aria-label="{{d.date}}" style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px 6px 0">
          <span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">{{d.date}}</span>
          <b style="font-size: 13px; font-weight: 700; color: {{d.netColor}}">{{d.net}}</b>
        </div>
        <div style="background: {{t.surface}}; box-shadow: {{t.shadow}}; border-radius: 16px; overflow: hidden">
          <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
            <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 58px; color: {{t.text}}; border-bottom: 1px solid {{t.line}}; text-decoration: none">
              <span style="width: 40px; height: 40px; border-radius: 13px; background: {{r.color}}; display: flex; align-items: center; justify-content: center; flex: none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="display: flex; align-items: center; gap: 6px">
                  <b style="font-size: 15px; font-weight: 700">{{r.title}}</b>
                  <sc-for list="{{r.pills}}" as="p" hint-placeholder-count="1">
                    <span style="font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 8px; background: {{p.bg}}; color: {{p.fg}}">{{p.label}}</span>
                  </sc-for>
                </span>
                <small style="font-size: 12px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</small>
              </span>
              <b style="font-size: 15px; font-weight: 700; color: {{r.amtColor}}">{{r.amount}}</b>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <nav aria-label="主要導覽" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 6px 8px 22px; background: {{t.glass}}; border-top: 1px solid {{t.border}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <sc-if value="{{tb.isAdd}}" hint-placeholder-val="{{false}}">
        <a href="EntryPhone.dc.html" aria-label="記一筆" style="justify-self: center; width: 52px; height: 52px; border-radius: 18px; background: {{t.primary}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(83,58,253,.28); text-decoration: none">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>
        </a>
      </sc-if>
      <sc-if value="{{tb.isTab}}" hint-placeholder-val="{{true}}">
        <a href="{{tb.href}}" aria-label="{{tb.aria}}" aria-current="{{tb.current}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; justify-content: center; color: {{tb.fg}}; font-size: 11px; font-weight: {{tb.weight}}; text-decoration: none">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.icon}}"></path></svg>
          <span>{{tb.label}}</span>
          <sc-if value="{{tb.dot}}" hint-placeholder-val="{{false}}">
            <span aria-hidden="true" style="position: absolute; top: 4px; left: 50%; margin-left: 8px; width: 8px; height: 8px; border-radius: 4px; background: {{tb.dotColor}}; box-shadow: 0 0 0 2px {{t.surface}}"></span>
          </sc-if>
        </a>
      </sc-if>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":1220}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!(this.props.dark ?? false);
    const t = dark ? {
      bg: '#0f1218', surface: '#171c24', glass: 'rgba(23,28,36,0.92)', soft: '#202733', border: '#313a48', line: '#252c38',
      text: '#f3f6fb', muted: '#99a3b3', primary: '#8b7dff', primarySoft: 'rgba(139,125,255,0.16)',
      successSoft: 'rgba(141,174,199,0.15)', warnSoft: 'rgba(150,165,197,0.15)', out: '#ff6369', in: '#43c98a',
      shadow: '0 12px 28px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05)', pillOn: '#2a3241'
    } : {
      bg: '#f1f3f6', surface: '#fafcff', glass: 'rgba(250,252,255,0.92)', soft: '#edf1f6', border: '#d8dee7', line: '#e8ecf2',
      text: '#151821', muted: '#6b7280', primary: '#533afd', primarySoft: 'rgba(83,58,253,0.10)',
      successSoft: 'rgba(95,127,152,0.12)', warnSoft: 'rgba(123,135,168,0.12)', out: '#e5484d', in: '#1f9d6b',
      shadow: '0 10px 30px rgba(18,26,40,0.045), inset 0 1px 0 rgba(255,255,255,0.62)', pillOn: '#fafcff'
    };
    const I = {
      food: 'M7 3v8 M4 3v5a3 3 0 0 0 6 0V3 M7 11v10 M17 3c-2 2-3 4-3 7h3v11',
      coffee: 'M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9z M17 10h1.5a2.5 2.5 0 0 1 0 5H17 M8 3v3 M12 3v3',
      bus: 'M5 16V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10 M5 11h14 M5 16h14v2H5z M8 21v-3 M16 21v-3',
      bag: 'M6 7h12l1 14H5L6 7z M9 7a3 3 0 0 1 6 0',
      bolt: 'M13 3L5 14h6l-1 7 8-11h-6l1-7z',
      film: 'M4 5h16v14H4z M4 9h16 M4 15h16 M8 5v4 M16 5v4 M8 15v4 M16 15v4',
      brief: 'M4 8h16v11H4z M9 8V5h6v3 M4 13h16',
      transfer: 'M7 7h13 M16 3l4 4-4 4 M17 17H4 M8 13l-4 4 4 4'
    };
    const C = { food: '#d0864a', drink: '#a88a5c', traffic: '#5f86c9', daily: '#4f9a72', house: '#4f8f8a', fun: '#8a7cc4', salary: '#3f9d7a', move: '#7d889c', other: '#8a94a6' };
    const cats = [
      { amt: 9820, color: C.food }, { amt: 8150, color: C.house }, { amt: 6930, color: C.daily },
      { amt: 3240, color: C.traffic }, { amt: 2860, color: C.fun }, { amt: 7460, color: C.other }
    ];
    const PILL = {
      split: { bg: t.successSoft, fg: t.text },
      recur: { bg: t.primarySoft, fg: t.primary },
      review: { bg: t.warnSoft, fg: t.text }
    };
    const R = (o) => ({
      ...o,
      pills: (o.pills || []).map(([k, label]) => ({ ...PILL[k], label })),
      amtColor: o.tone === 'in' ? t.in : o.tone === 'move' ? t.muted : t.out
    });
    const days = [
      { date: '10/22 週四 · 今天', net: '−$250', netColor: t.out, rows: [
        R({ icon: I.food, color: C.food, title: '午餐', sub: '餐飲 · 便當 · 現金', amount: '−$120' }),
        R({ icon: I.bus, color: C.traffic, title: '捷運', sub: '交通 · 悠遊卡', amount: '−$45' }),
        R({ icon: I.coffee, color: C.drink, title: '咖啡', sub: '飲品 · 路易莎 · 玉山 Pi 卡', amount: '−$85', pills: [['review', '待確認']] })
      ] },
      { date: '10/21 週三', net: '−$3,096', netColor: t.out, rows: [
        R({ icon: I.bag, color: C.daily, title: '全聯 採買', sub: '日用 · 食材 · 清潔 · 玉山 Pi 卡', amount: '−$1,286', pills: [['split', '多類別 3']] }),
        R({ icon: I.bolt, color: C.house, title: '電費', sub: '居家 · 台電 · 台新 Richart', amount: '−$1,420', pills: [['recur', '週期']] }),
        R({ icon: I.film, color: C.fun, title: 'Netflix', sub: '娛樂 · 玉山 Pi 卡', amount: '−$390', pills: [['recur', '週期']] })
      ] },
      { date: '10/20 週二', net: '+$71,740', netColor: t.in, rows: [
        R({ icon: I.brief, color: C.salary, title: '薪資', sub: '收入 · 台新 Richart', amount: '+$72,000', tone: 'in' }),
        R({ icon: I.transfer, color: C.move, title: '轉帳', sub: '台新 Richart → 元大交割戶', amount: '$20,000', tone: 'move' }),
        R({ icon: I.food, color: C.food, title: '晚餐', sub: '餐飲 · 現金', amount: '−$260' })
      ] }
    ];

    // 財務子頁：數字留在這裡
    const subTabs = [['記錄', 2, '提醒 2 項', 'TimelinePhone.dc.html'], ['帳戶', 1, '待確認 1 筆', 'AccountsPhone.dc.html'], ['記帳設定', 0, '', 'MobileNavPhone.dc.html']].map(([label, count, note, href]) => {
      const on = label === '記錄';
      return { label, href, current: on ? 'page' : 'false', aria: label + (note ? '，' + note : ''),
        bg: on ? t.pillOn : 'transparent', fg: on ? t.text : t.muted, weight: on ? 700 : 500,
        shadow: on ? '0 1px 2px rgba(0,0,0,.08)' : 'none', hasCount: count > 0, count };
    });
    // 底部分頁只用紅點表示「裡面有事」，所在分頁不顯示
    const DOT = { '物資': '有待買項目', '投資': '有需要注意的項目', '財務': '有待處理項目' };
    const tab = (label, icon, on, href) => ({ isTab: true, isAdd: false, label, icon, href: href || '#', current: on ? 'page' : 'false', fg: on ? t.primary : t.muted, weight: on ? 700 : 500,
      dot: !on && !!DOT[label], dotColor: t.out, aria: label + (!on && DOT[label] ? '，' + DOT[label] : '') });
    const tabs = [
      tab('投資', 'M3 17l6-6 4 4 8-8 M15 7h6v6', false, 'PortfolioPhone.dc.html'),
      { isTab: false, isAdd: true },
      tab('財務', 'M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zm0 0a2 2 0 0 1 2-2h13v4 M16 14h.01', true, 'AccountsPhone.dc.html'),
    ];
    return { t, cats, days, tabs, subTabs };
  }
}
</script>
</body>
</html>
